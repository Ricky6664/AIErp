; ============================================================
; ERP AI 自动验证修复系统 - 配置文件
; ============================================================

[schedule]
; 定时回归 cron 表达式（每天凌晨 3:00）
cron=0 3 * * *
; 启用定时回归
enabled=true

[scope]
; 一次性扫描的模式: full | quick
full_scan_mode=full
; 定时回归的模式: quick | compliance
cron_mode=quick

[modules]
; 需要验证的模块列表，all = 全部P0模块
target_modules=all

[fix]
; 自动修复最大重试次数
max_retry=3
; 单次 Stage 超时时间（分钟）
stage_timeout=30
; 是否自动创建 PR
auto_pr=true

[report]
; 报告输出目录
output_dir=reports
; 保留最近 N 份报告
keep_recent=10

[server]
; E2E 测试用的后端服务端口
e2e_port=8080
; 后端启动等待超时（秒）
startup_timeout=60
; 后端 profile
spring_profile=dev
