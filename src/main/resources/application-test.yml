# ============================================================
# ERP AI - 测试环境配置 (application-test.yml)
# ============================================================

# ---- 服务器配置 ----
server:
  port: 8081

# ---- 数据源配置 (PostgreSQL) ----
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://test-db:5432/erp_test?currentSchema=public&useUnicode=true&characterEncoding=utf-8
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # ---- Redis 缓存配置 ----
  data:
    redis:
      host: test-redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# ---- MyBatis-Plus 配置 ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.erp.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: is_deleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true

# ---- Swagger/Knife4j 文档配置 (测试环境关闭) ----
springdoc:
  api-docs:
    enabled: false

# ---- 日志配置 ----
logging:
  level:
    com.erp: INFO
    org.springframework: INFO
    com.baomidou.mybatisplus: INFO
