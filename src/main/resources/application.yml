# ERP AI Intelligent Management System
spring:
  application:
    name: erp-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console
  servlet:
    multipart:
      # 单文件最大上传大小
      max-file-size: 10MB
      # 单次请求最大上传大小
      max-request-size: 100MB
  # ---- Jackson 公共配置 ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

# ---- 服务器公共配置 ----
server:
  servlet:
    context-path: /api

# ---- 文件上传公共配置 ----
file:
  upload:
    # 允许的 MIME 类型白名单（逗号分隔）
    allowed-types: image/jpeg,image/png,application/pdf,application/vnd.ms-excel
    # 文件上传存储根路径
    path: /data/erp/upload

# ---- 分页默认值配置 ----
page:
  # 默认每页条数
  default-size: 20
  # 每页最大条数
  max-size: 100

# ---- MyBatis-Plus 全局配置（环境无关公共项） ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.erp.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# ---- Sa-Token 全局配置（环境无关公共项） ----
sa-token:
  # Token 名称（也是 cookie 名称）
  token-name: satoken
  # Token 有效期（秒），30天 = 2592000
  timeout: 2592000
  # Token 临时有效期（秒），无操作超时时间，30分钟 = 1800
  active-timeout: 1800
  # 是否允许同一账号并发登录（为true时允许一起登录，为false时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个Token
  is-share: true
  # Token 风格：uuid
  token-style: uuid
  # 是否输出操作日志
  is-log: false
