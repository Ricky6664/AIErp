# ERP AI Intelligent Management System
spring:
  application:
    name: erp-ai
  profiles:
    active: dev
  main:
    banner-mode: console
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true

# ---- MyBatis-Plus 全局配置（环境无关公共项） ----
mybatis-plus:
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
