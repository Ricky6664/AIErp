# ERP AI Intelligent Management System
spring:
  application:
    name: erp-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    banner-mode: console
  servlet:
    multipart:
      # 单文件最大上传大小
      max-file-size: 10MB
      # 单次请求最大上传大小
      max-request-size: 100MB
  # ---- Jackson 公共配置 ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true
  # ---- Redis Lettuce 连接池公共配置 ----
  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# ---- 服务器公共配置 ----
server:
  servlet:
    context-path: /api

# ---- 文件上传公共配置 ----
file:
  upload:
    # 允许的 MIME 类型白名单（逗号分隔）
    allowed-types: image/jpeg,image/png,application/pdf,application/vnd.ms-excel
    # 文件上传存储根路径
    path: /data/erp/upload

# ---- 分页默认值配置 ----
page:
  # 默认每页条数
  default-size: 20
  # 每页最大条数
  max-size: 100

# ---- MyBatis-Plus 全局配置（环境无关公共项） ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.erp.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: true
      logic-not-delete-value: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# ---- Sa-Token 全局配置（环境无关公共项） ----
sa-token:
  # Token 名称（也是 cookie 名称）
  token-name: satoken
  # Token 有效期（秒），30天 = 2592000
  timeout: 2592000
  # Token 临时有效期（秒），无操作超时时间，30分钟 = 1800
  active-timeout: 1800
  # 是否允许同一账号并发登录（为true时允许一起登录，为false时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个Token
  is-share: true
  # Token 风格：uuid
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # SaServletFilter 和 SaInterceptor 排除的路径（逗号分隔）
  exclude-paths: /api/auth/login,/api/auth/logout,/api/auth/token/refresh,/api/auth/token/verify,/doc.html,/v3/api-docs/**

# ---- 认证模块配置 ----
auth:
  captcha:
    # 验证码 Redis 缓存有效期（分钟）
    ttl-minutes: 5
    # 验证码字符长度
    code-length: 4
  login-security:
    # 最大登录失败次数，超过后锁定
    max-attempts: 5
    # 登录失败锁定时间（分钟）
    lock-minutes: 15
  user-info:
    # 用户未设置头像时的默认头像 URL
    default-avatar: ""
    # 用户信息接口返回的菜单权限树最大深度
    menu-tree-max-depth: 5
  menu-permission:
    # 菜单权限树最大层级深度, 超出不返回
    tree-max-depth: 5
    # 是否启用菜单权限缓存
    cache-enabled: true
    # 菜单权限缓存 TTL（秒）
    cache-ttl-seconds: 1800
    # 新菜单项的默认权限类型
    default-permission-type: view
    # 权限树中是否自动包含父节点路径
    include-parent-path: true

# ---- 菜单权限配置页配置 ----
menu-permission:
  menu-tree:
    # 菜单树默认展开层级（1=仅根节点, 2=展开到第2层, 0=全部展开）
    auto-expand-level: 2
    # 是否在权限树中显示已禁用的菜单
    show-disabled: false
    # 父子节点是否独立勾选（true=独立, false=关联勾选）
    check-strictly: false
  assignment:
    # 保存权限分配前是否弹出确认框
    confirm-before-save: true

# ---- 数据权限配置页配置 ----
data-permission:
  data-scope:
    # 默认数据权限范围（SELF=仅本人, DEPT=本部门, COMPANY=本公司, ALL=全部）
    default-scope: SELF
    # 是否显示"仅本人"选项
    show-self: true
    # 是否显示"本部门"选项
    show-dept: true
    # 是否显示"本公司"选项
    show-company: true
    # 是否显示"全部"选项
    show-all: false
  rule:
    # 数据权限规则缓存 TTL（秒）
    cache-ttl-seconds: 1800
    # 是否启用字段级权限
    field-level-enabled: false
    # 规则匹配失败时是否默认拒绝
    default-deny: true

# ---- 字段权限配置页配置 ----
field-permission:
  table-tree:
    # 数据表树默认展开层级（1=仅根节点, 2=展开到第2层, 0=全部展开）
    auto-expand-level: 2
    # 是否在表树中显示系统内部表
    show-system-tables: false
  field-rule:
    # 字段默认权限模式（EDITABLE=可编辑, READONLY=只读, HIDDEN=隐藏）
    default-mode: EDITABLE
    # 是否启用字段权限缓存
    cache-enabled: true
    # 字段权限缓存 TTL（秒）
    cache-ttl-seconds: 1800
    # 保存字段权限前是否弹出确认框
    confirm-before-save: true
