# ============================================================
# ERP AI - 预生产环境配置 (application-staging.yml)
# ============================================================

# ---- 服务器配置 ----
server:
  port: 8082

# ---- 数据源配置 (PostgreSQL) ----
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  # ---- Redis 缓存配置 ----
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# ---- MyBatis-Plus 环境覆盖项（生产级日志实现, 其余继承 application.yml） ----
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ---- Swagger/Knife4j 文档配置 (预生产环境关闭) ----
springdoc:
  api-docs:
    enabled: false

# ---- 日志配置 ----
logging:
  level:
    com.erp: INFO
    com.baomidou.mybatisplus: WARN
    org.springframework.web: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
    io.undertow: WARN
    org.apache: WARN
