; ============================================================
; ERP AI 自动开发系统 - 配置文件
; ============================================================

[project]
; 项目根目录绝对路径
path=D:\ClaudeCode\ErpProject\AiErp
; Git 开发分支
git_branch=develop

[execution]
; 单人模式停止开关（auto.bat 启动时）
; false = 当前任务完成后自动继续下一个
; true  = 当前任务完成后停止，不启动新窗口
single_stop=false

; 多人模式停止开关（parallel.bat 启动时）
; false = 工人完成任务后自动认领下一个
; true  = 所有工人完成当前任务后退出，不认领新任务
multi_stop=false

[parallel]
; 多人模式默认窗口数（parallel.bat 不带参数时使用）
; 范围：1~100，根据电脑性能配置，超过 100 会被限制为 100
max_workers=4

; 从 tasks_catalog.md 取任务到 tasks_active.md 的每批条数
; 必须 >= max_workers，确保每个工人都有任务可认领
fetch_batch_size=12

; 当 tasks_active.md 中可认领（⬜）任务数低于此值时
; 触发补充：从 tasks_catalog.md 再取 fetch_batch_size 条任务
fetch_threshold=5

[lock]
; 锁超时时间（秒），超过此时间视为死锁自动释放
timeout_seconds=120
; 获取锁失败时的重试间隔（秒）
retry_interval_seconds=3
; 最大重试次数
max_retries=40
