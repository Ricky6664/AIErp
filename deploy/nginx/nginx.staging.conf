# ============================================================
# ERP AI — Nginx 预发布环境配置（nginx.staging.conf）
# ============================================================
# 挂载方式：./deploy/nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
# 启动方式：ENV=staging docker compose --env-file .env.staging up -d
# ============================================================

upstream backend {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    server_name staging.erp.example.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主配置 ----
server {
    listen 443 ssl http2;
    server_name staging.erp.example.com;

    # ---- SSL 证书 ----
    ssl_certificate     /etc/nginx/ssl/staging.erp.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/staging.erp.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- 安全基础头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;

    # ---- 预发布环境 CORS 白名单 ----
    set $cors_origin "";
    if ($http_origin ~* "^https?://(staging\.erp\.example\.com|staging-admin\.erp\.example\.com)$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,Authorization,Content-Type" always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ---- 访问日志（预发布环境开启）----
    access_log /var/log/nginx/staging-access.log main;
    error_log  /var/log/nginx/staging-error.log warn;

    # ---- 健康检查 ----
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /actuator/health {
        proxy_pass http://backend;
    }

    # ---- API 代理 ----
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ---- WebSocket 代理 ----
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- 前端静态资源 ----
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
